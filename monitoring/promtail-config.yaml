# Promtail configuration — FakeCo "Real Appliances"
# Phase 11 — aggregates logs from Traefik, Technitium, all appliance containers
# Spec §21

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs via Docker socket — captures all fakeco.managed=true containers
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["fakeco.managed=true"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_fakeco_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_fakeco_phase"]
        target_label: phase
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
      - labels:
          level:
