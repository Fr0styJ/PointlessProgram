      fakeco.phase: "16"
      fakeco.managed: "true"
    profiles:
      - phase16

  # ---------------------------------------------------------------------------
  # PHASE 17: human-bridge — Principal control panel backend
  # Spec §17: inject actions as employees, approve expenses, update directives
  # ---------------------------------------------------------------------------
  human-bridge:
    build:
      context: ./human-bridge
      dockerfile: Dockerfile
    container_name: fakeco-human-bridge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fakeco}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-fakeco}"
      MAILSERVER_HOST: "mailserver"
      MAILSERVER_SMTP_PORT: "587"  # port 25 has no AUTH; docker-mailserver only offers AUTH on submission (587)
      MAILSERVER_BOT_SECRET: "${MAILSERVER_BOT_SECRET:?MAILSERVER_BOT_SECRET required}"
      MATTERMOST_URL: "http://mattermost:8065"
      MATTERMOST_ADMIN_TOKEN: "${MATTERMOST_ADMIN_TOKEN:-}"
      MATTERMOST_TEAM_ID: "${MATTERMOST_TEAM_ID:-}"
      MAILSERVER_IMAP_PORT: "143"
      ZAMMAD_URL: "http://zammad-nginx:8080"
      ZAMMAD_ADMIN_TOKEN: "${ZAMMAD_ADMIN_TOKEN:-}"
      WIKIJS_URL: "http://wikijs:3000"
      WIKIJS_ADMIN_TOKEN: "${WIKIJS_ADMIN_TOKEN:-}"
      ACCOUNTING_ENGINE_URL: "http://accounting-engine:8000"
      MEETING_SIM_URL: "http://meeting-simulator:8000"
      PRINCIPAL_EMAIL: "${PRINCIPAL_EMAIL:-principal@fakecorp.internal}"
      PRINCIPAL_NAME: "${PRINCIPAL_NAME:-Admin}"
      # Feature: Narrative-driven WordPress/Nextcloud content creation
      # WordPress is on net_dmz; Nextcloud on net_office (already connected).
      # WORDPRESS_ADMIN_APP_PASSWORD is a WordPress Application Password (not the login
      # password) — created once via create_wp_app_password.php for the principal user.
      WORDPRESS_URL: "http://wordpress"
      WORDPRESS_ADMIN_USER: "${WORDPRESS_ADMIN_USER:-principal}"
      WORDPRESS_ADMIN_APP_PASSWORD: "${WORDPRESS_ADMIN_APP_PASSWORD:-}"
      NEXTCLOUD_URL: "http://nextcloud"
      NEXTCLOUD_ADMIN_USER: "admin"
      NEXTCLOUD_ADMIN_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD:-placeholder}"
      LITELLM_URL: "http://litellm:4000"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-}"
      # Poll interval for the deliverable fulfillment loop (seconds wall-clock).
      DELIVERABLE_POLL_INTERVAL_SECONDS: "${DELIVERABLE_POLL_INTERVAL_SECONDS:-30}"
    networks:
      - net_clients
      - net_data
      - net_mail
      - net_office
      - net_dmz  # Needed to reach wordpress (WordPress REST API for content creation)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      fakeco.service: "human-bridge"
      fakeco.phase: "17"
      fakeco.managed: "true"
    profiles:
      - phase17

  # ---------------------------------------------------------------------------
  # PHASE 18: orchestrator — central simulation heartbeat (NO LLM calls)
  # Spec §18: schedules all periodic jobs, fires meeting-simulator + accounting-engine
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: fakeco-orchestrator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      narrative-db-migrate:
        condition: service_completed_successfully
      sim-clock:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fakeco}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-fakeco}"
      SIM_CLOCK_URL: "http://sim-clock:8000"
      MEETING_SIM_URL: "http://meeting-simulator:8000"
      ACCOUNTING_ENGINE_URL: "http://accounting-engine:8000"
      KPI_ENGINE_URL: "http://kpi-engine:8000"
      EXTERNAL_WORLD_URL: "http://external-world:8000"
      ORCHESTRATOR_TICK_INTERVAL: "${ORCHESTRATOR_TICK_INTERVAL:-60}"
      STANDUP_SIM_HOUR: "9"
      CROSS_DEPT_INTERVAL_DAYS: "14"
      PERF_REVIEW_INTERVAL_DAYS: "30"
      PAYROLL_INTERVAL_DAYS: "14"
      STALE_THREAD_DAYS: "2"
      APPROVAL_REMINDER_DAYS: "1"
      # Phase 19: PTO
      PTO_DAILY_PROBABILITY: "${PTO_DAILY_PROBABILITY:-0.01}"
      PTO_MIN_GAP_DAYS: "${PTO_MIN_GAP_DAYS:-45}"
      PTO_DURATION_MIN_DAYS: "${PTO_DURATION_MIN_DAYS:-3}"
      PTO_DURATION_MAX_DAYS: "${PTO_DURATION_MAX_DAYS:-7}"
      MAILSERVER_CONTAINER: "fakeco-mailserver"
      MAILSERVER_DOMAIN: "${MAILSERVER_DOMAIN:-fakecorp.internal}"
      MATTERMOST_URL: "http://mattermost:8065"
      MATTERMOST_ADMIN_TOKEN: "${MATTERMOST_ADMIN_TOKEN:-}"
      # Phase 27: Chaos — service availability controls (docker-socket-proxy is
      # never reached via raw docker exec/socket; POST-only start/stop/restart).
      DOCKER_SOCKET_PROXY_URL: "http://docker-socket-proxy:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Phase 19: for `docker exec fakeco-mailserver doveadm sieve ...`
    networks:
      - net_clients
      - net_data
      - net_office
      - net_mail
      - net_mgmt  # Phase 27: reach docker-socket-proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      fakeco.service: "orchestrator"
      fakeco.phase: "18"  # Phase 19 PTO, Phase 27 chaos controls folded into this container
      fakeco.managed: "true"
    profiles:
      - phase18

  # ---------------------------------------------------------------------------
  # PHASE 21+22: external-world — BetaCorp rival + customer/revenue generator
  # Spec §11.1, §11.2
  # ---------------------------------------------------------------------------
  external-world:
    build:
      context: ./external-world
      dockerfile: Dockerfile
    container_name: fakeco-external-world
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      narrative-db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fakeco}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-fakeco}"
      LITELLM_URL: "http://litellm:4000"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}"
      MAILSERVER_HOST: "mailserver"
      MAILSERVER_SMTP_PORT: "587"
      MAILSERVER_DOMAIN: "${MAILSERVER_DOMAIN:-fakecorp.internal}"
      MAILSERVER_BOT_SECRET: "${MAILSERVER_BOT_SECRET:?MAILSERVER_BOT_SECRET required}"
      ACCOUNTING_ENGINE_URL: "http://accounting-engine:8000"
      ZAMMAD_URL: "http://zammad-nginx:8080"
      ZAMMAD_ADMIN_TOKEN: "${ZAMMAD_ADMIN_TOKEN:-}"
      SIM_CLOCK_URL: "http://sim-clock:8000"
    networks:
      - net_clients
      - net_data
      - net_mail
      - net_office
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      fakeco.service: "external-world"
      fakeco.phase: "21"
      fakeco.managed: "true"
    profiles:
      - phase21

  # ---------------------------------------------------------------------------
  # PHASE 29: snapshot-manager — direct-DB-network sidecar for snapshot save/restore.
  # PHASE29_PLAN.md (signed off 2026-07-31): multi-homed onto net_data + net_dmz +
  # net_mail (every stateful appliance's DB/Maildir) + net_mgmt (docker-socket-proxy
  # start/stop calls during restore). NEVER uses `docker exec` — EXEC=0 on
  # docker-socket-proxy (Phase 1) is a hard constraint, not worked around here.
  # ---------------------------------------------------------------------------
  snapshot-manager:
    build:
      context: ./snapshot-manager
      dockerfile: Dockerfile
    container_name: fakeco-snapshot-manager
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      narrative-db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fakeco}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-fakeco}"
      POSTGRES_USER: "${POSTGRES_USER:-fakeco}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-fakeco}"
      MATTERMOST_DB_PASSWORD: "${MATTERMOST_DB_PASSWORD}"
      ZAMMAD_DB_PASSWORD: "${ZAMMAD_DB_PASSWORD}"
      WIKIJS_DB_PASSWORD: "${WIKIJS_DB_PASSWORD}"
      NEXTCLOUD_DB_PASSWORD: "${NEXTCLOUD_DB_PASSWORD}"
      WORDPRESS_DB_PASSWORD: "${WORDPRESS_DB_PASSWORD}"
      AKAUNTING_DB_PASSWORD: "${AKAUNTING_DB_PASSWORD}"
      SIM_CLOCK_URL: "http://sim-clock:8000"
      SOCKET_PROXY_URL: "http://docker-socket-proxy:2375"
      SNAPSHOT_ROOT: "/snapshots"
      MAILDIR_PATH: "/maildir"
      NEXTCLOUD_DATA_PATH: "/nextcloud_data"
    volumes:
      - snapshot_storage:/snapshots
      - mailserver_data:/maildir   # read-write at compose level; write access is enforced
                                   # in application code to only happen while mailserver is
                                   # stopped (restore path) — see snapshot-manager/main.py
      - nextcloud_data:/nextcloud_data
    networks:
      - net_data
      - net_dmz
      - net_mail
      - net_mgmt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      fakeco.service: "snapshot-manager"
      fakeco.phase: "29"
      fakeco.managed: "true"
    profiles:
      - phase13
      - phase29
      - phase36   # Phase 36: dashboard Data Management tab's Snapshots section

  # ---------------------------------------------------------------------------
  # PHASE 29: purge-manager — scoped + full data purge, gated by mandatory
  # pre-purge snapshot (calls snapshot-manager's own API) + typed confirmation.
  # ---------------------------------------------------------------------------
  purge-manager:
    build:
      context: ./purge-manager
      dockerfile: Dockerfile
    container_name: fakeco-purge-manager
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      narrative-db-migrate:
        condition: service_completed_successfully
      snapshot-manager:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fakeco}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-fakeco}"
      SNAPSHOT_MANAGER_URL: "http://snapshot-manager:8000"
      SIM_CLOCK_URL: "http://sim-clock:8000"
      ZAMMAD_URL: "http://zammad-nginx:8080"
      ZAMMAD_ADMIN_TOKEN: "${ZAMMAD_ADMIN_TOKEN:-}"
      WIKIJS_URL: "http://wikijs:3000"
      WIKIJS_ADMIN_TOKEN: "${WIKIJS_ADMIN_TOKEN:-}"
      MATTERMOST_URL: "http://mattermost:8065"
      MATTERMOST_ADMIN_TOKEN: "${MATTERMOST_ADMIN_TOKEN:-}"
      AKAUNTING_DB_PASSWORD: "${AKAUNTING_DB_PASSWORD}"
    networks:
      - net_clients
      - net_data
      - net_office
      - net_dmz
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      fakeco.service: "purge-manager"
      fakeco.phase: "29"
      fakeco.managed: "true"
    profiles:
      - phase13
      - phase29
      - phase36   # Phase 36: dashboard Data Management tab's scoped purge + Settings full-purge

  # ---------------------------------------------------------------------------
  # PHASE 33: dashboard — React/Vite SPA served by a thin FastAPI BFF.
  # PLAN_PHASES_33_38_DASHBOARD.md (signed off 2026-08-01): whole dashboard
  # (API + static SPA) gated behind HTTP Basic Auth from this phase onward.
  # Multi-homed: net_mgmt (host-published, browser-reachable, per the network
  # comment block near the top of this file) + net_clients (calls sim-clock
  # and orchestrator's own APIs) + net_data (direct Postgres reads for
  # narrative_threads/action_items/etc — no dedicated owning microservice for
  # those tables, same pattern orchestrator itself already uses — and for
  # LiteLLM_SpendLogs, reusing Phase 31's llm-spend.json query verbatim).
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: fakeco-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      narrative-db-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fakeco}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-fakeco}"
      SIM_CLOCK_URL: "http://sim-clock:8000"
      ORCHESTRATOR_URL: "http://orchestrator:8000"
      LITELLM_CONFIG_PATH: "/litellm-config/config.yaml"
      DASHBOARD_AUTH_USER: "${DASHBOARD_AUTH_USER:?DASHBOARD_AUTH_USER required}"
      DASHBOARD_AUTH_PASSWORD: "${DASHBOARD_AUTH_PASSWORD:?DASHBOARD_AUTH_PASSWORD required}"
      # Phase 34: HR tab's Fire/Hire (provisioning) + Payroll/Accounting tabs
      # (accounting-engine's raise/cash-balance/approve/reject endpoints).
      # Both already share net_clients/net_data with this container — no new
      # network needed.
      PROVISIONING_URL: "http://provisioning:8000"
      ACCOUNTING_ENGINE_URL: "http://accounting-engine:8000"
      AKAUNTING_COMPANY_ID: "${AKAUNTING_COMPANY_ID:-1}"
      AKAUNTING_PUBLIC_URL: "${AKAUNTING_PUBLIC_URL:-http://accounting.fakecorp.internal}"
      # Phase 35: External World / KPI / Company Direction tabs.
      # external-world and kpi-engine are both already on net_clients (shared
      # with this container) — no new network needed for those two proxies.
      EXTERNAL_WORLD_URL: "http://external-world:8000"
      KPI_ENGINE_URL: "http://kpi-engine:8000"
      # human-bridge (also net_clients) owns the company_directives write path
      # + its Wiki.js pinned-page sync — proxy there rather than duplicating.
      HUMAN_BRIDGE_URL: "http://human-bridge:8000"
      # Revenue-by-customer chart reads Akaunting's MariaDB directly (same
      # data/credentials Phase 31's Grafana MySQLAkaunting datasource and
      # purge-manager/snapshot-manager already use) — needs net_dmz, which this
      # container didn't previously have.
      AKAUNTING_DB_HOST: "akaunting-db"
      AKAUNTING_DB_NAME: "akaunting"
      AKAUNTING_DB_USER: "akaunting"
      AKAUNTING_DB_PASSWORD: "${AKAUNTING_DB_PASSWORD}"
      # Phase 36: Chaos / Data Management / Branding tabs + Settings' full-purge
      # flow. purge-manager/branding-manager share net_clients with this
      # container already; snapshot-manager shares net_mgmt — no new networks
      # needed for this container.
      PURGE_MANAGER_URL: "http://purge-manager:8000"
      SNAPSHOT_MANAGER_URL: "http://snapshot-manager:8000"
      BRANDING_MANAGER_URL: "http://branding-manager:8000"
      # Phase 37: TV wall (chat/ticket feeds), Errors panel + log tail (Loki),
      # Deep Links panel (static list + real Principal credentials).
      # Loki is already reachable on net_mgmt (shared with grafana/promtail) —
      # no new network needed for that. Mattermost/Zammad ARE new reachability
      # needs for this container (their APIs, not just their Traefik-routed
      # hostnames which the browser hits directly) — hence net_office, added
      # below, matching human-bridge's own multi-homing for the identical
      # "read recent posts/tickets via admin token" pattern (see human-bridge/
      # main.py's _poll_mattermost_once / _poll_zammad_once, reused verbatim
      # here rather than re-derived).
      LOKI_URL: "http://loki:3100"
      MATTERMOST_URL: "http://mattermost:8065"
      MATTERMOST_ADMIN_TOKEN: "${MATTERMOST_ADMIN_TOKEN:-}"
      MATTERMOST_TEAM_ID: "${MATTERMOST_TEAM_ID:-}"
      ZAMMAD_URL: "http://zammad-nginx:8080"
      ZAMMAD_ADMIN_TOKEN: "${ZAMMAD_ADMIN_TOKEN:-}"
      # Deep Links panel (2026-08-01 sign-off, amended — no iframe, direct
      # links + visible Principal credentials read from .env, reusing the
      # exact same env vars every other phase already uses for these
      # appliances — no new secrets minted for this panel).
      PRINCIPAL_EMAIL: "${PRINCIPAL_EMAIL:-principal@fakecorp.internal}"
      MATTERMOST_ADMIN_USER: "${MATTERMOST_ADMIN_USER:-}"
      MATTERMOST_ADMIN_PASSWORD: "${MATTERMOST_ADMIN_PASSWORD:-}"
      ZAMMAD_ADMIN_EMAIL: "${ZAMMAD_ADMIN_EMAIL:-}"
      ZAMMAD_ADMIN_PASSWORD: "${ZAMMAD_ADMIN_PASSWORD:-}"
      WIKIJS_ADMIN_EMAIL: "${WIKIJS_ADMIN_EMAIL:-}"
      WIKIJS_ADMIN_PASSWORD: "${WIKIJS_ADMIN_PASSWORD:-}"
      NEXTCLOUD_ADMIN_USER: "${NEXTCLOUD_ADMIN_USER:-admin}"
      NEXTCLOUD_ADMIN_PASSWORD: "${NEXTCLOUD_ADMIN_PASSWORD:-}"
      WORDPRESS_ADMIN_USER: "${WORDPRESS_ADMIN_USER:-}"
      WORDPRESS_ADMIN_PASSWORD: "${WORDPRESS_ADMIN_PASSWORD:-}"
      AKAUNTING_ADMIN_EMAIL: "${AKAUNTING_ADMIN_EMAIL:-}"
      AKAUNTING_ADMIN_PASSWORD: "${AKAUNTING_ADMIN_PASSWORD:-}"
      GRAFANA_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-}"
      MAILSERVER_BOT_SECRET: "${MAILSERVER_BOT_SECRET:-fakeco-bot-mail-secret-change-me}"
    volumes:
      - ./litellm/config.yaml:/litellm-config/config.yaml:ro
    networks:
      - net_mgmt
      - net_clients
      - net_data
      - net_dmz
      - net_office
    ports:
      - "8090:8000"   # host-published on net_mgmt, per this file's own network comment block
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      fakeco.service: "dashboard"
      fakeco.phase: "33"
      fakeco.managed: "true"
    profiles:
      - phase13
      - phase33
      - phase34   # Phase 34: HR/Payroll/Accounting tabs live in this same service/container
      - phase35   # Phase 35: External World/KPI/Company Direction tabs, same service/container
      - phase36   # Phase 36: Chaos/Data Management/Branding tabs + Settings full-purge

  # ---------------------------------------------------------------------------
  # PHASES 34+: Custom services — added as their phases execute.
  # Placeholders listed here for topology documentation: dashboard tabs for
  # HR/Payroll/Accounting (34), External World/KPI/Company Direction (35),
  # Chaos/Data Management/Branding (36), TV wall/Errors/log tail (37) all plug
  # into the Phase 33 dashboard shell above — no new service directories,
  # just new routes/components inside dashboard/ and new BFF endpoints.
  # ---------------------------------------------------------------------------
